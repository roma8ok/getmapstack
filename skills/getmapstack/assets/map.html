<!doctype html>
<meta charset="utf-8">
<title>Found features</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>html, body, #map { margin: 0; height: 100% }</style>
<div id="map"></div>
<script type="module">
// MapLibre GL JS 6 has no default export, so this must be a namespace import.
import * as maplibregl from "/vendor/maplibre-gl.js";

const data = await (await fetch("./found.json")).json();

const map = new maplibregl.Map({
  container: "map",
  style: "/martin/style/bright",
  center: [33.3823, 35.1856],
  zoom: 12
});

map.on("load", () => {
  map.addSource("found", { type: "geojson", data });
  map.addLayer({
    id: "found",
    type: "circle",
    source: "found",
    paint: {
      "circle-radius": 7,
      "circle-color": "#e11",
      "circle-stroke-width": 2,
      "circle-stroke-color": "#fff"
    }
  });
  // The view comes from the features, never from a zoom picked in advance.
  const bounds = new maplibregl.LngLatBounds();
  data.features.forEach(f => bounds.extend(f.geometry.coordinates));
  if (data.features.length) map.fitBounds(bounds, { padding: 60, maxZoom: 16 });
});
</script>
