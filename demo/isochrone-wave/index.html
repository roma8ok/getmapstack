<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How far can 15 minutes take you?</title>
    <!-- One description, byte-identical to the README's and to the tagline the
         page itself shows. Two wordings of the same project read as two
         projects to anything that merges entities across surfaces. -->
    <meta name="description" content="Self-hosted mapping stack. One command per country." />
    <link rel="canonical" href="https://roma8ok.github.io/getmapstack/" />
    <!-- Absolute by necessity: a card is assembled by a crawler that has no
         page to resolve a relative path against. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roma8ok.github.io/getmapstack/" />
    <meta property="og:title" content="How far can 15 minutes take you?" />
    <meta
      property="og:description"
      content="Self-hosted mapping stack. One command per country."
    />
    <meta property="og:image" content="https://roma8ok.github.io/getmapstack/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A dark map of Seoul with three isochrone waves drawn over it - car, bicycle and on foot - showing how far 15 minutes reaches by each."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Inline, so the page never 404s on /favicon.ico: three rings on the dark
         page colour, the wave the map draws. -->

      rel="icon"

    />

</html>
