<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" role="img" aria-label="One docker run command starts a container with Valhalla routing on port 8002, Photon geocoding on port 2322 and Martin vector tiles on port 3000, backed by OSM data baked into the image; your application talks to all three.">
  <style>
    :root {
      --panel: #1e293b; --stroke: #334155; --text: #f1f5f9; --muted: #94a3b8;
      /* one accent pair per service: box stroke gradient, port, request label, dots */
      --valhalla: #22d3ee; --valhalla-2: #a78bfa;
      --photon: #a3e635;   --photon-2: var(--valhalla); /* deliberate alias: Photon's gradient ends on the Valhalla cyan, not a separate color */
      --martin: #fbbf24;   --martin-2: #f472b6;
      /* the response thumbnail, in the colors of the basemap style the image ships */
      --map-bg: #f8f4f0; --map-water: #a0c8f0; --map-green: #d8e8c8; --map-road: #ffffff;
      --loop: 14s;
      --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    text { font-family: var(--sans); fill: var(--text); }
    .mono { font-family: var(--mono); }
    .muted { fill: var(--muted); }
    .svc-valhalla { fill: var(--valhalla); }
    .svc-photon { fill: var(--photon); }
    .svc-martin { fill: var(--martin); }
    .wire { fill: none; stroke: var(--stroke); stroke-width: 1.5; }
    #grad-valhalla .g-start { stop-color: var(--valhalla); }
    #grad-valhalla .g-end   { stop-color: var(--valhalla-2); }
    #grad-photon .g-start   { stop-color: var(--photon); }
    #grad-photon .g-end     { stop-color: var(--photon-2); }
    #grad-martin .g-start { stop-color: var(--martin); }
    #grad-martin .g-end   { stop-color: var(--martin-2); }

    /* --- timeline (one loop = --loop; 1% = 0.14s at 14s) ---
       0-12%   the command types itself
       12-16%  the container frame fades in
       16-27%  Valhalla, then Photon, then Martin slide up, staggered
       25-29%  the OSM data strip slides up - the window deliberately overlaps
               both neighbors
       27-30%  the application and the wires appear
       30-43%  wave 1: request to Valhalla, box glows, response returns
       43-51%  {"trip": ...} holds (1.12s)
       51-64%  wave 2: the same exchange with Photon
       64-72%  {"features": [...]} holds (1.12s)
       72-86%  wave 3: the same exchange with Martin
       86-97%  the basemap thumbnail holds (1.54s)
       97-100% the container and its contents fade out; the command bar carries
               across the loop seam
       The base markup is fully visible: without animation support this stays a
       readable static diagram, and no label depends on motion to be understood. */
    #header-cmd { animation: type var(--loop) steps(48, end) infinite; }
    #frame      { animation: reveal-frame var(--loop) linear infinite; }
    #g-valhalla { animation: reveal-valhalla var(--loop) linear infinite; }
    #g-photon   { animation: reveal-photon var(--loop) linear infinite; }
    #g-martin   { animation: reveal-martin var(--loop) linear infinite; }
    #g-osm      { animation: reveal-osm var(--loop) linear infinite; }
    #app        { animation: reveal-app var(--loop) linear infinite; }
    #wires      { animation: reveal-app var(--loop) linear infinite; }
    @keyframes type {
      0%        { clip-path: inset(0 100% 0 0); }
      12%, 100% { clip-path: inset(0 -2% 0 0); }
    }
    @keyframes reveal-frame {
      0%, 12%   { opacity: 0; }
      16%, 97%  { opacity: 1; }
      100%      { opacity: 0; }
    }
    @keyframes reveal-valhalla {
      0%, 16%   { opacity: 0; transform: translateY(10px); }
      20%, 97%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; }
    }
    @keyframes reveal-photon {
      0%, 19%   { opacity: 0; transform: translateY(10px); }
      23%, 97%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; }
    }
    @keyframes reveal-martin {
      0%, 23%   { opacity: 0; transform: translateY(10px); }
      27%, 97%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; }
    }
    @keyframes reveal-osm {
      0%, 25%   { opacity: 0; transform: translateY(10px); }
      29%, 97%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; }
    }
    @keyframes reveal-app {
      0%, 27%   { opacity: 0; transform: translateY(-10px); }
      30%, 97%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; }
    }

    /* --- request/response waves (start after the app appears) --- */
    .dot { opacity: 0; }
    #label-trip, #label-features, #minimap { opacity: 0; }
    @supports (offset-path: path('M 0 0 H 1')) {
      #req-valhalla { offset-path: path('M 355 100 C 315 116, 262 124, 200 205'); animation: req-valhalla var(--loop) linear infinite; }
      #res-valhalla { offset-path: path('M 200 205 C 262 124, 315 116, 355 100'); animation: res-valhalla var(--loop) linear infinite; }
      #req-photon   { offset-path: path('M 440 100 L 440 205'); animation: req-photon var(--loop) linear infinite; }
      #res-photon   { offset-path: path('M 440 205 L 440 100'); animation: res-photon var(--loop) linear infinite; }
      #req-martin   { offset-path: path('M 525 100 C 565 116, 618 124, 680 205'); animation: req-martin var(--loop) linear infinite; }
      #res-martin   { offset-path: path('M 680 205 C 618 124, 565 116, 525 100'); animation: res-martin var(--loop) linear infinite; }
      #valhalla-box { animation: glow-valhalla var(--loop) linear infinite; }
      #photon-box   { animation: glow-photon var(--loop) linear infinite; }
      #martin-box   { animation: glow-martin var(--loop) linear infinite; }
      #label-trip     { animation: hold-trip var(--loop) linear infinite; }
      #label-features { animation: hold-features var(--loop) linear infinite; }
      #minimap        { animation: hold-minimap var(--loop) linear infinite; }
    }
    @keyframes req-valhalla { 0%, 30% { offset-distance: 0%; opacity: 0; } 31% { opacity: 1; } 35% { opacity: 1; } 36% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes res-valhalla { 0%, 37% { offset-distance: 0%; opacity: 0; } 38% { opacity: 1; } 42% { opacity: 1; } 43% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes glow-valhalla { 0%, 34% { stroke-width: 2; } 36%, 42% { stroke-width: 4.5; } 45%, 100% { stroke-width: 2; } }
    @keyframes hold-trip { 0%, 42% { opacity: 0; } 43%, 51% { opacity: 1; } 53%, 100% { opacity: 0; } }

    @keyframes req-photon { 0%, 51% { offset-distance: 0%; opacity: 0; } 52% { opacity: 1; } 56% { opacity: 1; } 57% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes res-photon { 0%, 58% { offset-distance: 0%; opacity: 0; } 59% { opacity: 1; } 63% { opacity: 1; } 64% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes glow-photon { 0%, 55% { stroke-width: 2; } 57%, 63% { stroke-width: 4.5; } 66%, 100% { stroke-width: 2; } }
    @keyframes hold-features { 0%, 63% { opacity: 0; } 64%, 72% { opacity: 1; } 74%, 100% { opacity: 0; } }

    @keyframes req-martin { 0%, 72% { offset-distance: 0%; opacity: 0; } 73% { opacity: 1; } 77% { opacity: 1; } 78% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes res-martin { 0%, 79% { offset-distance: 0%; opacity: 0; } 80% { opacity: 1; } 84% { opacity: 1; } 86% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes glow-martin { 0%, 77% { stroke-width: 2; } 78%, 85% { stroke-width: 4.5; } 88%, 100% { stroke-width: 2; } }
    @keyframes hold-minimap { 0%, 85% { opacity: 0; } 86%, 97% { opacity: 1; } 99%, 100% { opacity: 0; } }

    /* the request label of the service currently being called burns brighter */
    #label-post { animation: label-post var(--loop) linear infinite; }
    #label-get  { animation: label-get var(--loop) linear infinite; }
    #label-tile { animation: label-tile var(--loop) linear infinite; }
    @keyframes label-post { 0%, 29% { opacity: 0.5; } 31%, 51% { opacity: 1; } 53%, 100% { opacity: 0.5; } }
    @keyframes label-get  { 0%, 50% { opacity: 0.5; } 52%, 72% { opacity: 1; } 74%, 100% { opacity: 0.5; } }
    @keyframes label-tile { 0%, 71% { opacity: 0.5; } 73%, 97% { opacity: 1; } 99%, 100% { opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) {
      #header-cmd, #frame, #app, #wires, #g-valhalla, #g-photon, #g-martin, #g-osm,
      #req-valhalla, #res-valhalla, #valhalla-box, #label-trip, #label-post,
      #req-photon, #res-photon, #photon-box, #label-features, #label-get,
      #req-martin, #res-martin, #martin-box, #minimap, #label-tile { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-valhalla" x1="0" y1="0" x2="1" y2="0">
      <stop class="g-start" offset="0"/><stop class="g-end" offset="1"/>
    </linearGradient>
    <linearGradient id="grad-photon" x1="0" y1="0" x2="1" y2="0">
      <stop class="g-start" offset="0"/><stop class="g-end" offset="1"/>
    </linearGradient>
    <linearGradient id="grad-martin" x1="0" y1="0" x2="1" y2="0">
      <stop class="g-start" offset="0"/><stop class="g-end" offset="1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="880" height="440" rx="20" fill="url(#bg-grad)"/>

  <!-- the drop shadow lives on the rects, not the groups: filtering a group
       rasterizes its text and blurs it, while filtered rects keep text crisp -->
  <g id="app">
    <rect x="340" y="28" width="200" height="72" rx="14" fill="var(--panel)" stroke="var(--stroke)" stroke-width="1.5" filter="url(#soft)"/>
    <text x="440" y="58" font-size="16" font-weight="600" text-anchor="middle">Your application</text>
    <text class="muted" x="440" y="82" font-size="12" text-anchor="middle">any HTTP client</text>
  </g>

  <!-- Wires leave the app node near its bottom corners and fan out flat, so the
       request labels at y=140 sit in clear air. label-get sits 10px to the side
       of its own wire; label-post and label-tile need 20px, measured at the
       bottom of the label box (y=143), where the curved wires have swept in to
       x=262 / 618. At y=137 - one slice higher - they are still at x=271 / 609. -->
  <g id="wires">
    <path id="wire-valhalla" class="wire" d="M 355 100 C 315 116, 262 124, 200 205"/>
    <path id="wire-photon" class="wire" d="M 440 100 L 440 205"/>
    <path id="wire-martin" class="wire" d="M 525 100 C 565 116, 618 124, 680 205"/>
    <text id="label-post" class="mono svc-valhalla" x="241" y="140" font-size="13" text-anchor="end">POST /route</text>
    <text id="label-get" class="mono svc-photon" x="450" y="140" font-size="13">GET /api?q=</text>
    <text id="label-tile" class="mono svc-martin" x="639" y="140" font-size="13">GET /basemap/{z}/{x}/{y}</text>
  </g>

  <g id="container">
    <rect id="frame" x="60" y="150" width="760" height="250" rx="18" fill="#0f172a" fill-opacity="0.5" stroke="var(--stroke)" stroke-width="1.5"/>
    <!-- The command is the frame's title bar. All three wires pass behind it
         (at y=176 they are at x=225 / 440 / 655), which is what lets the middle
         column exist at all. 12px, not 13px: the 89-character string is ~697px
         at 13px, and it is the pill's margin (not the text's) that forces the
         drop - at 13px the pill would span roughly 76..804 inside the 60..820
         frame, about 16-20px of margin, too tight for OS font-metric variance. -->
    <rect id="cmd-pill" x="103" y="175" width="674" height="26" rx="8" fill="var(--panel)" fill-opacity="0.92"/>
    <text id="header-cmd" class="mono" x="440" y="192" font-size="12" text-anchor="middle" opacity="0.9"><!-- the prompt sign borrows the Photon green; it names no service --><tspan class="svc-photon">$</tspan> docker run -p 8002:8002 -p 2322:2322 -p 3000:3000 ghcr.io/roma8ok/getmapstack/{country}</text>

    <!-- Grid: three columns 210 wide with a 30 gap, centers at x=200 / 440 / 680,
         inside a frame padded 35 on both sides. Rows: services y=205 (h 95),
         data strip y=325 (h 52). A fourth service means a narrower column, not a
         new row - recompute the centers from this line. -->
    <g id="g-valhalla">
      <rect id="valhalla-box" x="95" y="205" width="210" height="95" rx="14" fill="var(--panel)" stroke="url(#grad-valhalla)" stroke-width="2" filter="url(#soft)"/>
      <text x="120" y="243" font-size="18" font-weight="600">Valhalla</text>
      <text class="muted" x="120" y="268" font-size="13">routing</text>
      <text class="mono svc-valhalla" x="280" y="258" font-size="15" text-anchor="end">:8002</text>
    </g>

    <g id="g-photon">
      <rect id="photon-box" x="335" y="205" width="210" height="95" rx="14" fill="var(--panel)" stroke="url(#grad-photon)" stroke-width="2" filter="url(#soft)"/>
      <text x="360" y="243" font-size="18" font-weight="600">Photon</text>
      <text class="muted" x="360" y="268" font-size="13">geocoding</text>
      <text class="mono svc-photon" x="520" y="258" font-size="15" text-anchor="end">:2322</text>
    </g>

    <g id="g-martin">
      <rect id="martin-box" x="575" y="205" width="210" height="95" rx="14" fill="var(--panel)" stroke="url(#grad-martin)" stroke-width="2" filter="url(#soft)"/>
      <text x="600" y="243" font-size="18" font-weight="600">Martin</text>
      <text class="muted" x="600" y="268" font-size="13">vector tiles</text>
      <text class="mono svc-martin" x="760" y="258" font-size="15" text-anchor="end">:3000</text>
    </g>

    <g id="g-osm">
      <rect x="95" y="325" width="690" height="52" rx="12" fill="var(--panel)" stroke="var(--stroke)" stroke-width="1.5" filter="url(#soft)"/>
      <text class="muted" x="440" y="357" font-size="14" text-anchor="middle">Country OSM data, baked into the image</text>
    </g>
  </g>

  <!-- animated request/response dots and labels (invisible when idle) -->
  <g id="anim">
    <circle id="req-valhalla" class="dot svc-valhalla" r="6"/>
    <circle id="res-valhalla" class="dot svc-valhalla" r="6"/>
    <text id="label-trip" class="mono svc-valhalla" x="320" y="52" font-size="12" text-anchor="end">{"trip": ...}</text>
    <circle id="req-photon" class="dot svc-photon" r="6"/>
    <circle id="res-photon" class="dot svc-photon" r="6"/>
    <text id="label-features" class="mono svc-photon" x="560" y="52" font-size="12" text-anchor="start">{"features": [...]}</text>
    <circle id="req-martin" class="dot svc-martin" r="6"/>
    <circle id="res-martin" class="dot svc-martin" r="6"/>

    <!-- Martin's response: a scrap of basemap in the style's own colors. It sits
         in the band the JSON labels use - they never share a time window. -->
    <g id="minimap" transform="translate(576,30)">
      <clipPath id="mm-clip"><rect width="44" height="44" rx="6"/></clipPath>
      <rect width="44" height="44" rx="6" fill="var(--map-bg)" stroke="var(--stroke)" stroke-width="1"/>
      <g clip-path="url(#mm-clip)">
        <path d="M -1 31 C 8 27, 15 35, 23 34 C 32 33, 38 39, 45 37 L 45 45 L -1 45 Z" fill="var(--map-water)"/>
        <rect x="4" y="6" width="15" height="11" rx="2" fill="var(--map-green)"/>
        <path d="M -1 23 L 45 15" stroke="var(--map-road)" stroke-width="3" fill="none"/>
        <path d="M 13 -1 L 20 45" stroke="var(--map-road)" stroke-width="2.5" fill="none"/>
        <path d="M 30 -1 L 35 25" stroke="var(--map-road)" stroke-width="1.6" fill="none"/>
      </g>
    </g>
  </g>
</svg>
